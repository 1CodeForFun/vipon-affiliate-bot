name: FB Text Posts

# Runs every day at 10:00 AM CT (15:00 UTC during CDT)
# Posts all pending FB text posts (col O) and marks col Q = Yes
on:
  workflow_dispatch:  # triggered by cron-job.org daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: 1CodeForFun/vipon-secrets
          token: ${{ secrets.SECRETS_PAT }}
          path: secrets

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Chrome is needed by the flash-deal section, which scrapes one live
      # lightning deal at the end of the run. The posting itself needs none of it.
      - name: Install system dependencies (Chrome)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser chromium-chromedriver

      # Deliberately NOT -r requirements.txt: this flow's job is posting, and the
      # full file pulls edge-tts, openai, cloudinary and the Google API stack,
      # none of which are used here. Every extra package is one more way for the
      # install step to fail and take the day's posts down with it.
      - name: Install Python dependencies
        run: |
          pip install gspread oauth2client requests
          pip install selenium undetected-chromedriver beautifulsoup4 Pillow

      - name: Copy credential files to working directory
        run: |
          cp secrets/vipon_google_creds.json .
          cp secrets/fb_page_token.json .
          cp secrets/fb_page_token-canada.json .

      - name: Post FB text
        env:
          SECRETS_DIR: .
        run: python FBP_ready.py
