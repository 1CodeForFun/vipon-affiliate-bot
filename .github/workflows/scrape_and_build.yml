name: Scrape & Build Videos

# Runs every day at 6:00 AM CT (11:00 UTC during CDT / 12:00 UTC during CST)
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: 1CodeForFun/vipon-secrets
          token: ${{ secrets.SECRETS_PAT }}
          path: secrets

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg + Chrome)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg chromium-browser chromium-chromedriver

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Amazon PA-API SDK (not on PyPI — installed from Amazon GitHub)
        run: pip install git+https://github.com/amzn/paapi5-python-sdk.git

      - name: Copy credential files
        run: |
          # vipon_google_creds.json is read from the working directory (relative path)
          cp secrets/vipon_google_creds.json .
          # These three are read from ~ (home dir) by vipon26.py
          cp secrets/PAAPI.csv ~/PAAPI.csv
          cp secrets/videokey.txt ~/videokey.txt
          cp secrets/geminikey.txt ~/geminikey.txt

      - name: Run scrape & build
        run: python vipon26.py
