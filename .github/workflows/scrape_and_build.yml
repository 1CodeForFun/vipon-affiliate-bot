name: Scrape & Build Videos

# Runs every day at 6:00 AM CT (11:00 UTC during CDT / 12:00 UTC during CST)
on:
  workflow_dispatch:  # triggered by cron-job.org; can also be run manually from GitHub UI
    inputs:
      product_limit:
        description: 'Max products to scrape (default 24)'
        required: false
        default: ''
      max_discovery:
        description: 'Max tiles to collect (default 150)'
        required: false
        default: ''
      scroll_max:
        description: 'Max scroll steps (default 50)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: 1CodeForFun/vipon-secrets
          token: ${{ secrets.SECRETS_PAT }}
          path: secrets

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg + Chrome)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg chromium-browser chromium-chromedriver

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Amazon PA-API SDK from secrets repo
        run: |
          if [ -f secrets/paapi5_sdk.zip ]; then
            mkdir -p paapi5_python_sdk
            unzip -qo secrets/paapi5_sdk.zip -d paapi5_python_sdk
            echo "paapi5_python_sdk extracted successfully"
          else
            echo "WARNING: paapi5_sdk.zip not found in secrets repo — Amazon images will be skipped"
          fi

      - name: Copy credential files
        run: |
          cp secrets/vipon_google_creds.json .
          cp secrets/PAAPI.csv ~/PAAPI.csv
          cp secrets/videokey.txt ~/videokey.txt
          [ -f secrets/geminikey.txt ] && cp secrets/geminikey.txt ~/geminikey.txt || true
          cp secrets/vipon_accounts.json ~/vipon_accounts.json
          cp secrets/cloudinary.json ~/cloudinary.json
          [ -f secrets/geminikeys.txt ] && cp secrets/geminikeys.txt ~/geminikeys.txt || true

      - name: Run scrape & build
        env:
          PRODUCT_LIMIT: ${{ github.event.inputs.product_limit }}
          MAX_DISCOVERY: ${{ github.event.inputs.max_discovery }}
          SCROLL_MAX:    ${{ github.event.inputs.scroll_max }}
        run: python vipon26.py
