name: Post Best Reel to TikTok + Pinterest

# Posts the highest-scored unposted vipon reel to TikTok + Pinterest via Buffer.
# Cycles through available reels by Social Score; resets automatically when all are done.
# Trigger as often as you like via cron-job.org workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  post-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: 1CodeForFun/vipon-secrets
          token: ${{ secrets.SECRETS_PAT }}
          path: secrets

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install gspread oauth2client requests

      - name: Run Buffer poster
        env:
          SECRETS_DIR: secrets
        run: python post_best_to_buffer.py
