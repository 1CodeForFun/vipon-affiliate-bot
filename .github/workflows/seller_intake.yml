name: Seller Form Intake

# Standalone run of Phase 3 (US) + Phase 4 (CA) seller form processing.
# Trigger manually from GitHub Actions UI to retry stuck rows without
# running the full daily scrape & build.
on:
  workflow_dispatch:

jobs:
  seller:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: 1CodeForFun/vipon-secrets
          token: ${{ secrets.SECRETS_PAT }}
          path: secrets

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg for reel building)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Amazon PA-API SDK from secrets repo
        run: |
          if [ -f secrets/paapi5_sdk.zip ]; then
            mkdir -p paapi5_python_sdk
            unzip -qo secrets/paapi5_sdk.zip -d paapi5_python_sdk
            echo "paapi5_python_sdk extracted successfully"
          else
            echo "WARNING: paapi5_sdk.zip not found in secrets repo — Amazon images will be skipped"
          fi

      - name: Copy credential files
        run: |
          cp secrets/vipon_google_creds.json .
          cp secrets/PAAPI.csv ~/PAAPI.csv
          cp secrets/videokey.txt ~/videokey.txt
          cp secrets/cloudinary.json ~/cloudinary.json
          cp secrets/vipon_accounts.json ~/vipon_accounts.json
          [ -f secrets/geminikey.txt  ] && cp secrets/geminikey.txt  ~/geminikey.txt  || true
          [ -f secrets/geminikeys.txt ] && cp secrets/geminikeys.txt ~/geminikeys.txt || true

      - name: Run seller intake
        run: python seller8.py
