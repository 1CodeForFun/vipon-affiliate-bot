name: TEST — Deals page probe

# TEMPORARY diagnostic workflow. Delete along with test_deals_scrape.py once
# the Amazon deals shortfall on CI is resolved.
#
# Runs the deals fetch ONLY — no sheet, no Vipon login, no video build — so it
# finishes in ~2 minutes instead of the full pipeline's hour, and records what
# Amazon actually serves the GitHub runner.
#
# Manual dispatch only: nothing schedules this.

on:
  workflow_dispatch:
    inputs:
      tld:
        description: 'Marketplace: com, ca, or both'
        required: false
        default: 'both'
      scrolls:
        description: 'Scroll rounds (default 8)'
        required: false
        default: '8'
      source:
        description: 'Page for the scroll-method comparison: goldbox, deals, or both'
        required: false
        default: 'goldbox'
      mode:
        description: 'full (deals probe + scroll comparison) / load-timing (initial-load card-count sampler only) / api-direct (test the raw JSON API found under /deals, bypassing scroll+DOM entirely) — each mode skips the others, so a dispatch only pays for what is actually being asked'
        required: false
        default: 'full'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same Chrome install as scrape_and_build.yml, so the probe sees exactly
      # what the real run sees. No secrets are needed: the deals page is public.
      - name: Install Chrome
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe the deals page
        if: ${{ github.event.inputs.mode != 'load-timing' }}
        run: |
          python test_deals_scrape.py \
            --tld "${{ github.event.inputs.tld || 'both' }}" \
            --scrolls "${{ github.event.inputs.scrolls || '8' }}"

      # Scripted vs real-wheel scrolling, with continuous collection.
      # Locally, headless, both marketplaces reach 400-500 deals either way.
      # This is the identical test on the runner that returns single digits.
      - name: Scroll-method comparison
        if: ${{ always() && github.event.inputs.mode != 'load-timing' }}
        run: |
          python test_wheel_scroll.py --tld "${{ github.event.inputs.tld || 'both' }}" \
            --rounds 55 --source "${{ github.event.inputs.source || 'goldbox' }}"

      # No scroll, no click — samples the on-screen card count every 0.5s for
      # ~22s right after navigation, to see whether the fixed 8s initial wait
      # in fetch_brand_deals() is actually long enough, or whether cards are
      # still mounting well past it (which would explain deals visible in a
      # real browser before any button click that never make it into the
      # scrape). See test_load_timing.py's own docstring for why this has to
      # run from here and not locally: timing is exactly the kind of thing
      # that can differ between this runner and any other machine.
      - name: Initial-load timing (no scroll, no click)
        if: ${{ always() && github.event.inputs.mode == 'load-timing' }}
        run: python test_load_timing.py --tld "${{ github.event.inputs.tld || 'both' }}"

      # Found via the browser pane: /deals is backed by a plain JSON API
      # (d2b/api/v1/products/search), bypassing scroll/click/DOM entirely.
      # 300 unique products in 3.2s from a residential session. What is
      # UNKNOWN and can only be answered from here: whether .com serves this
      # to the runner at all, and whether it needs real browser cookies or a
      # bare request works with nothing.
      - name: Raw API direct (bypasses scroll and DOM)
        if: ${{ always() && github.event.inputs.mode == 'api-direct' }}
        run: python test_api_direct.py --tld "${{ github.event.inputs.tld || 'both' }}"

      - name: Upload what Amazon served
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-probe
          path: debug_artifacts/
          if-no-files-found: warn
          retention-days: 7
