name: Publish Reel

# Build-on-publish: each run selects the highest social-score unposted product,
# builds the v4 concept video, and posts ONE reel (US to FB+IG+YT, CA to FB).
# Triggered by cron-job.org on the 6 CT peak slots (8a/12p/2p/6p/8p/9p).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: 1CodeForFun/vipon-secrets
          token: ${{ secrets.SECRETS_PAT }}
          path: secrets

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg + Chromium for the video builder)
        run: |
          sudo apt-get update -y
          # fonts-noto-color-emoji: the hook overlay draws colour emoji with Pillow
          sudo apt-get install -y ffmpeg chromium-browser chromium-chromedriver fonts-noto-color-emoji

      - name: Install Python dependencies
        run: pip install gspread oauth2client requests selenium six google-auth google-auth-oauthlib google-api-python-client Pillow

      - name: Install Amazon PA-API SDK from secrets repo
        run: |
          if [ -f secrets/paapi5_sdk.zip ]; then
            mkdir -p paapi5_python_sdk
            unzip -qo secrets/paapi5_sdk.zip -d paapi5_python_sdk
            echo "paapi5_python_sdk extracted successfully"
          else
            echo "WARNING: paapi5_sdk.zip not found — Amazon PA-API images will be skipped"
          fi

      - name: Copy credential files for the video builder
        run: |
          cp secrets/cloudinary.json ~/cloudinary.json
          # PAAPI.csv is legacy: PA-API v5 was retired 2026-05-15. Kept only so the
          # old client init does not raise; FDP-credentials.csv is what is used now.
          [ -f secrets/PAAPI.csv            ] && cp secrets/PAAPI.csv            ~/PAAPI.csv            || true
          [ -f secrets/FDP-credentials.csv  ] && cp secrets/FDP-credentials.csv  ~/FDP-credentials.csv  || true
          [ -f secrets/geminipro.txt      ] && cp secrets/geminipro.txt      ~/geminipro.txt      || true
          [ -f secrets/geminikey.txt      ] && cp secrets/geminikey.txt      ~/geminikey.txt      || true
          [ -f secrets/geminikeys.txt     ] && cp secrets/geminikeys.txt     ~/geminikeys.txt     || true
          [ -f secrets/cf_account_id.txt  ] && cp secrets/cf_account_id.txt  ~/cf_account_id.txt  || true
          [ -f secrets/cf_api_token.txt   ] && cp secrets/cf_api_token.txt   ~/cf_api_token.txt   || true

      - name: Publish reel
        env:
          SECRETS_DIR: secrets
        run: python vipon_publisher.py
